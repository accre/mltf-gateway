name: Push Docker Image

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Build release distributions
        run: |
          ./ci/gateway/build.sh -p -t ghcr.io/accre/mltf-gateway-latest
          docker push ghcr.io/accre/mltf-gateway-latest

