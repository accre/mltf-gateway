name: Push Docker Image

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  release-build:
    runs-on: 
      - ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Build release distributions
        run: |
          ls -lah
          pwd
          ./ci/mltf-container/build.sh -c -t ghcr.io/accre/mltf-gateway-latest
          docker push ghcr.io/accre/mltf-gateway-latest
