name: Push Docker Image

on:
  push:
    branches:
      - 'main'
jobs:
  commit-docker-latest:
    runs-on: 
      - ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release distributions
        run: |
          ls -lah
          pwd
          echo $GITHUB_TOKEN
          ./ci/mltf-container/build.sh -c -t ghcr.io/accre/mltf-gateway:latest
          docker push ghcr.io/accre/mltf-gateway:latest
