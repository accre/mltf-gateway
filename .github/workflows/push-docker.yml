name: Push Docker Image

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  commit-docker-latest:
    runs-on: 
      - ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          ./ci/mltf-container/build.sh -c -t ghcr.io/accre/mltf-gateway:latest
          docker push ghcr.io/accre/mltf-gateway:latest